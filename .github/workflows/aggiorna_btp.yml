name: Aggiorna Listino BTP

on:
  schedule:
    # Esegue alle 16:47 UTC (17:47 ora italiana solare / 18:47 legale) dal lunedì al venerdì
    - cron: '47 16 * * 1-5'
  workflow_dispatch: # Ti permette di avviarlo manualmente con un clic quando vuoi

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui lo scraper BTP
        run: python aggiorna_btp.py

      - name: Salva i file aggiornati nel repository
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add btp_data.js btp_mot_borsa_italiana.json btp_puliti.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento giornaliero BTP" && git push)
